name: Update Calendar Events

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "fetch_calendar.py"
      - "styles.css"
      - "requirements.txt"
      - ".github/workflows/update-calendar.yml"

permissions:
  contents: write

concurrency:
  group: kalender
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python fetch_calendar.py
      - name: Wijzigingen committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --staged --quiet; then
            echo "Niets gewijzigd."
          else
            git commit -m "Kalender bijgewerkt ($(date -u +%F))"
            git push
          fi
